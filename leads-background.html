<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads Motion Background</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #131211;
  }
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<script>
(() => {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Subtle mouse parallax
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('mousemove', (e) => {
    mouse.tx = (e.clientX / W - 0.5) * 2;
    mouse.ty = (e.clientY / H - 0.5) * 2;
  });

  // ---------------------------------------------------------------
  // Two emitters ("leads" flowing in from both sides):
  //  - LEFT : straight converging streaks, close to the reference
  //  - RIGHT: similar spread, but the streaks arc gently and the
  //           source sits lower, so it is not a mirror copy
  // ---------------------------------------------------------------

  function makeEmitter(side, opts) {
    const lines = [];
    for (let i = 0; i < opts.lineCount; i++) {
      const u = i / (opts.lineCount - 1);           // 0..1 across the fan
      lines.push({
        u,
        angle: opts.spreadStart + u * (opts.spreadEnd - opts.spreadStart),
        len: opts.reach * (0.55 + Math.random() * 0.45),
        z: Math.random(),                           // fake depth: alpha + width
        phase: Math.random() * Math.PI * 2,
        waveAmp: 6 + Math.random() * 18,
        waveFreq: 0.6 + Math.random() * 1.2,
        // a small band of lines carries a cold blue tint (kept rare)
        blue: u > opts.blueBand[0] && u < opts.blueBand[1] && Math.random() < 0.5
      });
    }
    return { side, opts, lines };
  }

  let leftEmitter, rightEmitter;

  function buildEmitters() {
    leftEmitter = makeEmitter('left', {
      lineCount: 110,
      spreadStart: -0.34,     // radians, fan opening
      spreadEnd: 0.40,
      reach: Math.max(W * 0.72, 760),
      curve: 0,               // straight streaks
      blueBand: [0.30, 0.40],
      origin: () => ({ x: -W * 0.10, y: H * 0.44 }),
      drift: 0.055            // slow breathing rotation
    });

    rightEmitter = makeEmitter('right', {
      lineCount: 95,
      spreadStart: Math.PI - 0.46,   // opens toward the left
      spreadEnd: Math.PI + 0.30,
      reach: Math.max(W * 0.64, 680),
      curve: 1,               // arced streaks -> the "different" side
      blueBand: [0.55, 0.66],
      origin: () => ({ x: W * 1.09, y: H * 0.62 }),
      drift: -0.04
    });
  }
  buildEmitters();
  window.addEventListener('resize', buildEmitters);

  // Point along a streak at t (0..1), including wave + arc displacement
  function pointOnLine(em, line, t, time) {
    const o = em.opts.origin();
    const breath = Math.sin(time * 0.00022 + line.phase * 0.3) * em.opts.drift;
    const a = line.angle + breath
            + mouse.x * 0.012 * (em.side === 'left' ? 1 : -1);

    const d = t * line.len;
    let x = o.x + Math.cos(a) * d;
    let y = o.y + Math.sin(a) * d + mouse.y * 10 * t;

    // shimmering wave, grows toward the tip
    const wave = Math.sin(time * 0.00045 * line.waveFreq + line.phase + t * 4.5)
               * line.waveAmp * t;
    y += wave;

    // right side only: gentle upward arc, strongest at the tip
    if (em.opts.curve) {
      y -= t * t * H * 0.16;
      x -= t * t * W * 0.02;
    }
    return { x, y };
  }

  const SEGMENTS = 22;

  function drawEmitter(em, time) {
    for (const line of em.lines) {
      const depth = 0.25 + line.z * 0.75;
      const alpha = 0.028 * depth;

      ctx.beginPath();
      for (let s = 0; s <= SEGMENTS; s++) {
        const t = s / SEGMENTS;
        const p = pointOnLine(em, line, t, time);
        if (s === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      // brighter near the source, dissolving toward the tip (like the reference wedge)
      const a0 = pointOnLine(em, line, 0, time);
      const a1 = pointOnLine(em, line, 1, time);
      const grad = ctx.createLinearGradient(a0.x, a0.y, a1.x, a1.y);
      if (line.blue) {
        grad.addColorStop(0, `rgba(56, 88, 170, ${alpha * 4.2})`);
        grad.addColorStop(0.5, `rgba(56, 88, 170, ${alpha * 1.6})`);
        grad.addColorStop(1, 'rgba(56, 88, 170, 0)');
      } else {
        grad.addColorStop(0, `rgba(216, 208, 198, ${alpha * 3.4})`);
        grad.addColorStop(0.5, `rgba(216, 208, 198, ${alpha * 1.3})`);
        grad.addColorStop(1, 'rgba(216, 208, 198, 0)');
      }
      ctx.strokeStyle = grad;
      ctx.lineWidth = 0.4 + line.z * 0.7;
      ctx.stroke();
    }
  }

  // ---------------------------------------------------------------
  // Particles: the "leads" travelling along the streaks
  // ---------------------------------------------------------------

  const ORANGE = ['255,138,60', '255,176,102', '255,110,40'];
  const BLUE   = ['40,72,158', '58,94,182'];

  function pickColor() {
    const r = Math.random();
    if (r < 0.12) return { c: BLUE[Math.floor(Math.random() * BLUE.length)], blue: true };
    if (r < 0.17) return { c: '235,228,220', blue: false };   // stray white ember
    return { c: ORANGE[Math.floor(Math.random() * ORANGE.length)], blue: false };
  }

  function makeParticle(em) {
    const line = em.lines[Math.floor(Math.random() * em.lines.length)];
    const col = pickColor();
    return {
      em, line,
      t: Math.random() * 0.9,
      speed: (0.00025 + Math.random() * 0.0006) * (0.5 + line.z),
      size: 0.5 + Math.random() * 1.2,
      color: col.c,
      blue: col.blue,
      flicker: Math.random() * Math.PI * 2
    };
  }

  const particles = [];
  function buildParticles() {
    particles.length = 0;
    const perSide = Math.round(Math.min(W, 1600) / 18);   // ~85 on desktop
    for (let i = 0; i < perSide; i++) particles.push(makeParticle(leftEmitter));
    for (let i = 0; i < perSide * 0.8; i++) particles.push(makeParticle(rightEmitter));
  }
  buildParticles();
  window.addEventListener('resize', buildParticles);

  function drawParticles(time, dt) {
    for (let i = 0; i < particles.length; i++) {
      let p = particles[i];
      p.t += p.speed * dt;
      if (p.t > 1) { particles[i] = makeParticle(p.em); continue; }

      const pos = pointOnLine(p.em, p.line, p.t, time);
      const fadeIn = Math.min(p.t * 6, 1);
      const fadeOut = Math.min((1 - p.t) * 3, 1);
      const flicker = 0.75 + Math.sin(time * 0.006 + p.flicker) * 0.25;
      const a = fadeIn * fadeOut * flicker * (0.35 + p.line.z * 0.65);

      // ember trail
      const tail = pointOnLine(p.em, p.line, Math.max(p.t - 0.035, 0), time);
      const grad = ctx.createLinearGradient(tail.x, tail.y, pos.x, pos.y);
      grad.addColorStop(0, `rgba(${p.color}, 0)`);
      grad.addColorStop(1, `rgba(${p.color}, ${a * 0.55})`);
      ctx.strokeStyle = grad;
      ctx.lineWidth = p.size * 0.8;
      ctx.beginPath();
      ctx.moveTo(tail.x, tail.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();

      // core dot with soft glow
      const glow = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, p.size * 4);
      glow.addColorStop(0, `rgba(${p.color}, ${a})`);
      glow.addColorStop(0.4, `rgba(${p.color}, ${a * 0.35})`);
      glow.addColorStop(1, `rgba(${p.color}, 0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, p.size * 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------------------------------------------------------------
  // Frame loop
  // ---------------------------------------------------------------

  // faint warm halo where each fan is born
  function drawSourceGlow(em, radius, strength) {
    const o = em.opts.origin();
    const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, radius);
    g.addColorStop(0, `rgba(210, 190, 170, ${strength})`);
    g.addColorStop(0.5, `rgba(190, 170, 150, ${strength * 0.35})`);
    g.addColorStop(1, 'rgba(190, 170, 150, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(o.x - radius, o.y - radius, radius * 2, radius * 2);
  }

  function drawVignette() {
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35,
                                       W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(19, 18, 17, 0)');
    v.addColorStop(1, 'rgba(10, 9, 9, 0.55)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  let last = performance.now();

  function frame(now) {
    const dt = Math.min(now - last, 50);
    last = now;

    // eased parallax
    mouse.x += (mouse.tx - mouse.x) * 0.04;
    mouse.y += (mouse.ty - mouse.y) * 0.04;

    ctx.fillStyle = '#131211';
    ctx.fillRect(0, 0, W, H);

    const t = reducedMotion ? 0 : now;
    drawSourceGlow(leftEmitter, W * 0.22, 0.05);
    drawSourceGlow(rightEmitter, W * 0.17, 0.035);
    drawEmitter(leftEmitter, t);
    drawEmitter(rightEmitter, t);
    drawParticles(t, reducedMotion ? 0 : dt);
    drawVignette();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
