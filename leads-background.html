<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads Motion Background</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #131211;
  }
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<script>
(() => {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Subtle mouse parallax
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('mousemove', (e) => {
    mouse.tx = (e.clientX / W - 0.5) * 2;
    mouse.ty = (e.clientY / H - 0.5) * 2;
  });

  // ---------------------------------------------------------------
  // One connected ribbon: every streak is born at the left source,
  // fans open through the middle, and re-converges into the right
  // source. The two ends stay asymmetric (right sits lower and the
  // bulge peaks slightly left of center) so it isn't a mirror.
  // ---------------------------------------------------------------

  const ribbon = { lines: [] };

  function leftOrigin()  { return { x: -W * 0.08, y: H * 0.44 }; }
  function rightOrigin() { return { x: W * 1.08,  y: H * 0.60 }; }

  function buildRibbon() {
    ribbon.lines = [];
    const count = 150;
    for (let i = 0; i < count; i++) {
      const u = i / (count - 1);                    // 0..1 across the fan
      ribbon.lines.push({
        u,
        bulge: (u - 0.5) * 2 * H * 0.42 * (0.65 + Math.random() * 0.35),
        peak: 0.7 + u * 0.5,                        // envelope exponent: shifts
                                                    // where each line opens widest
        z: Math.random(),                           // fake depth: alpha + width
        phase: Math.random() * Math.PI * 2,
        waveAmp: 5 + Math.random() * 14,
        waveFreq: 0.6 + Math.random() * 1.2,
        // one narrow band of lines carries a cold blue tint (kept rare)
        blue: u > 0.32 && u < 0.40 && Math.random() < 0.4
      });
    }
  }
  buildRibbon();
  window.addEventListener('resize', buildRibbon);

  // Point along a streak at t (0..1) from left source to right source
  function pointOnLine(line, t, time) {
    const L = leftOrigin();
    const R = rightOrigin();

    let x = L.x + (R.x - L.x) * t;
    let y = L.y + (R.y - L.y) * t + mouse.y * 10 * Math.sin(Math.PI * t);

    // opening envelope: 0 at both sources, widest mid-flight; the
    // per-line exponent skews the peak so the shape stays asymmetric
    const env = Math.sin(Math.PI * Math.pow(t, line.peak));

    // slow breathing of the whole ribbon
    const breath = 1 + Math.sin(time * 0.00022 + line.phase * 0.3) * 0.06;

    y += line.bulge * env * breath;
    y += mouse.x * 8 * (t - 0.5);

    // shimmering wave, only visible where the fan is open
    y += Math.sin(time * 0.00045 * line.waveFreq + line.phase + t * 5)
       * line.waveAmp * env;

    return { x, y };
  }

  const SEGMENTS = 26;

  function drawRibbon(time) {
    for (const line of ribbon.lines) {
      const depth = 0.25 + line.z * 0.75;
      const alpha = 0.024 * depth;

      ctx.beginPath();
      for (let s = 0; s <= SEGMENTS; s++) {
        const t = s / SEGMENTS;
        const p = pointOnLine(line, t, time);
        if (s === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }

      // bright where the streaks converge, softest mid-flight
      const a0 = pointOnLine(line, 0, time);
      const a1 = pointOnLine(line, 1, time);
      const grad = ctx.createLinearGradient(a0.x, a0.y, a1.x, a1.y);
      if (line.blue) {
        grad.addColorStop(0, `rgba(52, 78, 148, ${alpha * 3.6})`);
        grad.addColorStop(0.5, `rgba(52, 78, 148, ${alpha * 1.3})`);
        grad.addColorStop(1, `rgba(52, 78, 148, ${alpha * 2.6})`);
      } else {
        grad.addColorStop(0, `rgba(210, 203, 194, ${alpha * 3.2})`);
        grad.addColorStop(0.5, `rgba(210, 203, 194, ${alpha * 1.1})`);
        grad.addColorStop(1, `rgba(210, 203, 194, ${alpha * 2.4})`);
      }
      ctx.strokeStyle = grad;
      ctx.lineWidth = 0.4 + line.z * 0.7;
      ctx.stroke();
    }
  }

  // ---------------------------------------------------------------
  // Particles: the "leads" transitioning from left to right
  // ---------------------------------------------------------------

  const ORANGE = ['226,128,64', '222,152,100', '212,112,52'];
  const BLUE   = ['42,68,138', '56,86,160'];

  function pickColor() {
    const r = Math.random();
    if (r < 0.10) return BLUE[Math.floor(Math.random() * BLUE.length)];
    if (r < 0.14) return '224,218,210';               // stray pale ember
    return ORANGE[Math.floor(Math.random() * ORANGE.length)];
  }

  function makeParticle(fresh) {
    const line = ribbon.lines[Math.floor(Math.random() * ribbon.lines.length)];
    return {
      line,
      t: fresh ? Math.random() * 0.05 : Math.random(),
      speed: (0.00018 + Math.random() * 0.00042) * (0.5 + line.z),
      size: 0.5 + Math.random() * 1.1,
      color: pickColor(),
      flicker: Math.random() * Math.PI * 2
    };
  }

  const particles = [];
  function buildParticles() {
    particles.length = 0;
    const count = Math.round(Math.min(W, 1600) / 12);   // ~130 on desktop
    for (let i = 0; i < count; i++) particles.push(makeParticle(false));
  }
  buildParticles();
  window.addEventListener('resize', buildParticles);

  function drawParticles(time, dt) {
    for (let i = 0; i < particles.length; i++) {
      let p = particles[i];
      p.t += p.speed * dt;
      if (p.t > 1) { particles[i] = makeParticle(true); continue; }

      const pos = pointOnLine(p.line, p.t, time);
      const fadeIn = Math.min(p.t * 8, 1);
      const fadeOut = Math.min((1 - p.t) * 8, 1);
      const flicker = 0.75 + Math.sin(time * 0.006 + p.flicker) * 0.25;
      const a = fadeIn * fadeOut * flicker * (0.28 + p.line.z * 0.52);

      // ember trail
      const tail = pointOnLine(p.line, Math.max(p.t - 0.02, 0), time);
      const grad = ctx.createLinearGradient(tail.x, tail.y, pos.x, pos.y);
      grad.addColorStop(0, `rgba(${p.color}, 0)`);
      grad.addColorStop(1, `rgba(${p.color}, ${a * 0.5})`);
      ctx.strokeStyle = grad;
      ctx.lineWidth = p.size * 0.8;
      ctx.beginPath();
      ctx.moveTo(tail.x, tail.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();

      // core dot with soft glow
      const glow = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, p.size * 3.5);
      glow.addColorStop(0, `rgba(${p.color}, ${a * 0.9})`);
      glow.addColorStop(0.4, `rgba(${p.color}, ${a * 0.3})`);
      glow.addColorStop(1, `rgba(${p.color}, 0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, p.size * 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------------------------------------------------------------
  // Frame loop
  // ---------------------------------------------------------------

  // faint warm halo where the ribbon converges
  function drawSourceGlow(origin, radius, strength) {
    const g = ctx.createRadialGradient(origin.x, origin.y, 0, origin.x, origin.y, radius);
    g.addColorStop(0, `rgba(205, 190, 172, ${strength})`);
    g.addColorStop(0.5, `rgba(188, 172, 154, ${strength * 0.35})`);
    g.addColorStop(1, 'rgba(188, 172, 154, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(origin.x - radius, origin.y - radius, radius * 2, radius * 2);
  }

  function drawVignette() {
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35,
                                       W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(19, 18, 17, 0)');
    v.addColorStop(1, 'rgba(10, 9, 9, 0.55)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  let last = performance.now();

  function frame(now) {
    requestAnimationFrame(frame);   // schedule first so a bad frame can't kill the loop
    const dt = Math.min(now - last, 50);
    last = now;

    // eased parallax
    mouse.x += (mouse.tx - mouse.x) * 0.04;
    mouse.y += (mouse.ty - mouse.y) * 0.04;

    ctx.fillStyle = '#131211';
    ctx.fillRect(0, 0, W, H);

    const t = reducedMotion ? 0 : now;
    drawSourceGlow(leftOrigin(), W * 0.20, 0.045);
    drawSourceGlow(rightOrigin(), W * 0.16, 0.03);
    drawRibbon(t);
    drawParticles(t, reducedMotion ? 0 : dt);
    drawVignette();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
