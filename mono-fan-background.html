<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mono 3D Fan Background</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #131211;
  }
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<script>
(() => {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Subtle mouse parallax (tilts the whole cone a little)
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('mousemove', (e) => {
    mouse.tx = (e.clientX / W - 0.5) * 2;
    mouse.ty = (e.clientY / H - 0.5) * 2;
  });

  // ---------------------------------------------------------------
  // One colour, one shape: a true 3D cone of rays. Every line is
  // born at a single apex just off the left edge and opens toward
  // the right. The cone slowly revolves around its own axis, so in
  // perspective each line continuously drifts, widens, and changes
  // brightness as it travels through depth. Front rays are brighter
  // and spread wider; rays swinging to the back compress and dim.
  // ---------------------------------------------------------------

  const COLOR = '214, 206, 197';        // the single colour, warm off-white
  const RAY_COUNT = 320;
  const MAX_SPREAD = 0.50;              // cone half-angle, radians
  const ROT_SPEED = 0.000055;           // radians per ms — full turn ~2 min
  const FOCAL = 1000;                   // perspective focal length, px

  const rays = [];

  function buildRays() {
    rays.length = 0;
    for (let i = 0; i < RAY_COUNT; i++) {
      // bias toward the axis: dense core wedge, sparse outer spread
      const spread = MAX_SPREAD * (0.06 + 0.94 * Math.pow(Math.random(), 1.3));
      rays.push({
        theta: Math.random() * Math.PI * 2,   // position around the axis
        spread,
        len: 0.55 + Math.random() * 0.5,      // fraction of max reach
        jitter: 0.6 + Math.random() * 0.4,    // per-line brightness variance
        width: 0.4 + Math.random() * 0.5
      });
    }
  }
  buildRays();

  function apex() {
    return {
      x: -W * 0.06 + mouse.x * 14,
      y: H * 0.45 + mouse.y * 14
    };
  }

  function project(x, y, z) {
    const cx = W * 0.5, cy = H * 0.5;
    const s = FOCAL / (FOCAL - z);
    return { x: cx + (x - cx) * s, y: cy + (y - cy) * s };
  }

  function drawFan(time) {
    const a = apex();
    const reach = W * 0.95;
    const rot = time * ROT_SPEED;
    const tilt = mouse.x * 0.05;          // parallax nudges the revolve

    for (const ray of rays) {
      const th = ray.theta + rot + tilt;
      const sinS = Math.sin(ray.spread);

      // 3D direction: x along the axis, y/z around it
      const dy = sinS * Math.cos(th);
      const dz = sinS * Math.sin(th);
      const dx = Math.cos(ray.spread);

      const L = reach * ray.len;
      const ex = a.x + dx * L;
      const ey = a.y + dy * L * 0.62;     // squash vertically to a wide fan
      const ez = dz * L * 0.38;

      const p0 = project(a.x, a.y, 0);
      const p1 = project(ex, ey, Math.min(ez, FOCAL * 0.75));

      // front of the revolve is bright, the back nearly disappears
      const front = 0.5 + 0.5 * Math.sin(th) * (ray.spread / MAX_SPREAD);
      const alpha = (0.03 + 0.11 * front) * ray.jitter;

      const grad = ctx.createLinearGradient(p0.x, p0.y, p1.x, p1.y);
      grad.addColorStop(0, `rgba(${COLOR}, ${alpha * 1.9})`);
      grad.addColorStop(0.4, `rgba(${COLOR}, ${alpha * 0.6})`);
      grad.addColorStop(0.85, `rgba(${COLOR}, ${alpha * 0.12})`);
      grad.addColorStop(1, `rgba(${COLOR}, 0)`);

      ctx.strokeStyle = grad;
      ctx.lineWidth = ray.width * (0.7 + 0.6 * front);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
  }

  // soft halo where all the lines get together — same colour, nothing else
  function drawApexGlow() {
    const a = apex();
    const r = Math.min(W, H) * 0.45;
    const g = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, r);
    g.addColorStop(0, `rgba(${COLOR}, 0.07)`);
    g.addColorStop(0.4, `rgba(${COLOR}, 0.025)`);
    g.addColorStop(1, `rgba(${COLOR}, 0)`);
    ctx.fillStyle = g;
    ctx.fillRect(a.x - r, a.y - r, r * 2, r * 2);
  }

  function drawVignette() {
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35,
                                       W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(19, 18, 17, 0)');
    v.addColorStop(1, 'rgba(10, 9, 9, 0.55)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  function frame(now) {
    requestAnimationFrame(frame);   // schedule first so a bad frame can't kill the loop

    // eased parallax
    mouse.x += (mouse.tx - mouse.x) * 0.04;
    mouse.y += (mouse.ty - mouse.y) * 0.04;

    ctx.fillStyle = '#131211';
    ctx.fillRect(0, 0, W, H);

    const t = reducedMotion ? 0 : now;
    drawApexGlow();
    drawFan(t);
    drawVignette();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
